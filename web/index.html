<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Si la app se publica en una subcarpeta, Flutter reemplaza este valor con
    el argumento `--base-href` de `flutter build web`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="App del personal de NovaTech: pedidos, alistamiento, rutas, aprobaciones, inventario y energía.">
  <meta name="theme-color" content="#0B1F3A">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NovaTech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NovaTech Personal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B1F3A; }
    /* Pantalla de carga mientras se descarga la app (se quita al arrancar Flutter). */
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 36px;
      background: #0B1F3A; transition: opacity .3s ease;
    }
    #carga img { width: min(320px, 70vw); height: auto; }
    #carga .franja { display: flex; width: 160px; height: 4px; border-radius: 2px; overflow: hidden; }
    #carga .franja span { flex: 1; animation: pulso 1.2s ease-in-out infinite; }
    #carga .franja span:nth-child(1) { background: #E4002B; }
    #carga .franja span:nth-child(2) { background: #FF7A00; animation-delay: .15s; }
    #carga .franja span:nth-child(3) { background: #0A9B45; animation-delay: .3s; }
    #carga .franja span:nth-child(4) { background: #0B6FD8; animation-delay: .45s; }
    @keyframes pulso { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="carga" aria-label="Cargando NovaTech">
    <img src="icons/logo-carga.png" alt="NovaTech">
    <div class="franja"><span></span><span></span><span></span><span></span></div>
  </div>
  <script>
    // Cuando Flutter dibuja su primer cuadro, se desvanece la pantalla de carga.
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga');
      if (!carga) return;
      carga.style.opacity = '0';
      setTimeout(function () { carga.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
